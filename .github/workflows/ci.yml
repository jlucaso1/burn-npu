name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly. Cargo.lock is not committed, so this is what catches upstream
    # breakage before it becomes a four-month-old broken release.
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features intel --all-targets -- -D warnings
      - run: cargo clippy --features qualcomm --all-targets -- -D warnings

  test-cpu-intel:
    name: CPU and Intel fallback tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      # No vendor runtime is installed on this runner. Hardware-only tests stay ignored.
      - run: cargo test --features intel
      - run: BURN_NPU_DISABLE=1 cargo test --features intel
      # Checked arithmetic and release-only paths differ from debug.
      - run: cargo test --release --features intel

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features intel --all-targets

  # Every feature must at least compile on both non-Apple platforms. The
  # `intel` feature uses openvino runtime-linking and `qualcomm` opens the QNN
  # backend at runtime, so neither needs its vendor runtime installed here.
  #
  # Windows matters specifically because detect.rs has Windows-only probes for
  # both the QNN HTP DLL and the OpenVINO DLL that no other job compiles.
  check:
    name: check (${{ matrix.feature }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        feature: [default, intel, qualcomm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        shell: bash
        run: |
          if [ "${{ matrix.feature }}" = "default" ]; then
            cargo check --all-targets
          else
            cargo check --features ${{ matrix.feature }} --all-targets
          fi

  # The apple feature needs macOS 15+ for MLTensor and swiftc for npu-sys.
  # This is the only job that runs the test suite against real NPU dispatch.
  test-apple:
    name: test (apple, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: swiftc --version
      - run: cargo test --features apple
      - run: cargo test
